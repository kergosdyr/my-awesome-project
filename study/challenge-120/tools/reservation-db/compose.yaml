name: challenge-day001
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local-challenge-only
      MYSQL_DATABASE: challenge_day001
      MYSQL_USER: challenge
      MYSQL_PASSWORD: challenge
    ports:
      - "127.0.0.1:13316:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-challenge-only"]
      interval: 3s
      timeout: 3s
      retries: 30
