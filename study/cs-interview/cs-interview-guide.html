afka","topic":"구조와 데이터 흐름","question":"Producer가 메시지를 Kafka에 보내고 저장되기까지의 과정을 설명해 주세요.","answer":"Producer가 Key와 Value를 직렬화하고 Partitioner가 대상 Partition을 고릅니다. Record Accumulator에서 같은 Partition 데이터를 Batch로 모아 해당 Partition Leader Broker에 전송합니다. Leader가 로그에 Append하고 `acks` 조건을 만족하면 성공을 응답하며, 재시도 가능한 오류면 Producer가 다시 보냅니다. Batch, 압축, In-Flight 요청 설정이 처리량·지연·순서에 영향을 줍니다.","easy":"","caution":""},{"id":"KAFKA-04","priority":3,"domain":"Kafka","topic":"구조와 데이터 흐름","question":"Partition Key는 왜 중요하며, 메시지 순서는 어디까지 보장되나요?","answer":"같은 Key는 일반적으로 같은 Partition으로 보내져 사용자나 주문 단위의 순서를 유지합니다. Kafka가 보장하는 총순서는 Topic 전체가 아니라 Partition 내부의 Offset 순서입니다. Key가 한 값에 몰리면 Hot Partition이 생기므로 순서가 필요한 업무 단위를 최소 Key로 잡고, 순서와 분산 사이의 Trade-Off를 결정합니다.","easy":"","caution":""},{"id":"KAFKA-05","priority":3,"domain":"Kafka","topic":"구조와 데이터 흐름","question":"Consumer Group과 Consumer의 관계를 설명해 주세요.","answer":"같은 Group ID의 Consumer들은 Topic Partition을 나눠 읽어 하나의 논리적 구독자를 이룹니다. 한 Partition은 같은 Group 안에서 동시에 한 Consumer에만 할당되므로 순서를 유지합니다. 다른 Group은 같은 이벤트를 독립적으로 다시 읽을 수 있어 분석, 알림, 저장 파이프라인을 분리할 수 있습니다.","easy":"","caution":""},{"id":"KAFKA-06","priority":3,"domain":"Kafka","topic":"구조와 데이터 흐름","question":"Offset이 무엇이고 누가 어떻게 관리하나요?","answer":"Offset은 Partition 안에서 Record 위치를 나타내는 증가 번호입니다. Consumer는 어디까지 처리했는지 다음에 읽을 Offset을 Group별로 Kafka의 `__consumer_offsets` Topic에 Commit합니다. 자동 Commit은 단순하지만 실제 처리 완료와 시점이 어긋날 수 있어, 중요한 작업은 처리 성공 후 수동 Commit하고 실패·재시도 경계를 명확히 합니다.","easy":"","caution":""},{"id":"KAFKA-07","priority":3,"domain":"Kafka","topic":"전달 보장과 장애","question":"At-Most-Once, At-Least-Once, Exactly-Once 전달을 비교해 주세요.","answer":"At-Most-Once는 처리 전에 Offset을 Commit해 중복은 적지만 장애 시 메시지를 잃을 수 있습니다. At-Least-Once는 처리 후 Commit해 유실을 줄이지만 장애 구간에서 중복이 발생하므로 Consumer가 멱등해야 합니다. Exactly-Once는 정의한 Kafka 처리 경계 안에서 결과와 Offset을 원자화하지만 외부 DB·API까지 자동으로 한 번 실행되게 하지는 않아 별도 Idempotency가 필요합니다.","easy":"","caution":""},{"id":"KAFKA-08","priority":3,"domain":"Kafka","topic":"전달 보장과 장애","question":"Producer의 `acks`, ISR, `min.insync.replicas`의 관계를 설명해 주세요.","answer":"`acks=0`은 확인을 기다리지 않고, `acks=1`은 Leader 기록만, `acks=all`은 현재 ISR의 복제를 기다립니다. ISR은 Leader를 충분히 따라온 Replica 집합이고 `min.insync.replicas`는 `acks=all` 쓰기를 허용할 최소 ISR 수입니다. 예를 들어 Replication Factor 3, 최소 ISR 2면 한 노드 장애에도 안전한 쓰기를 계속하지만 두 노드가 빠지면 가용성보다 내구성을 택해 쓰기를 거부합니다.","easy":"","caution":""},{"id":"KAFKA-09","priority":3,"domain":"Kafka","topic":"전달 보장과 장애","question":"Idempotent Producer는 어떤 중복을 막아주고 어떤 중복은 막지 못하나요?","answer":"Idempotent Producer는 Producer ID와 Partition별 Sequence Number로 재시도 중 같은 Record가 Broker 로그에 중복 Append되는 것을 막습니다. 하지만 애플리케이션이 같은 업무 이벤트를 두 번 생성하거나, Consumer가 외부 DB 반영을 두 번 하는 문제까지 막지는 않습니다. 업무 Event ID와 Consumer 측 Unique Constraint 또는 멱등 Upsert가 별도로 필요합니다.","easy":"","caution":""},{"id":"KAFKA-10","priority":2,"domain":"Kafka","topic":"전달 보장과 장애","question":"Kafka Transaction은 무엇을 원자적으로 묶을 수 있나요?","answer":"Kafka Transaction은 한 Producer가 여러 Partition에 쓴 Record와 Consumer Offset Commit을 하나의 원자적 단위로 묶을 수 있습니다. `read_committed` Consumer는 Commit된 Transaction만 읽어 Kafka→처리→Kafka 파이프라인의 Exactly-Once Semantics를 구성합니다. 일반 RDB나 외부 API 호출은 이 Transaction에 포함되지 않습니다.","easy":"","caution":""},{"id":"KAFKA-11","priority":3,"domain":"Kafka","topic":"전달 보장과 장애","question":"DB 반영과 Offset Commit 사이의 장애 문제를 어떻게 해결하나요?","answer":"DB 반영 후 Offset Commit 전에 죽으면 같은 메시지를 다시 읽어 DB 작업이 중복될 수 있고, Commit 후 DB 반영 전에 죽으면 메시지를 잃습니다. 보통 처리 후 Commit하는 At-Least-Once와 Event ID Unique Constraint, Inbox 테이블, 멱등 Upsert를 조합합니다. DB 변경에서 Kafka 발행까지 원자성이 필요하면 Transactional Outbox에 함께 기록하고 별도 Publisher가 전송합니다.","easy":"","caution":""},{"id":"KAFKA-12","priority":3,"domain":"Kafka","topic":"전달 보장과 장애","question":"Retry Topic과 DLQ를 어떻게 설계하며 Poison Message는 어떻게 처리하나요?","answer":"일시 오류는 횟수 제한과 지수 Backoff를 둔 Retry Topic으로 보내고, 영구 오류나 한도를 넘은 메시지는 원본 Metadata와 실패 원인을 붙여 DLQ로 격리합니다. Poison Message를 같은 Partition에서 무한 재시도하면 뒤 이벤트까지 막으므로 격리하되, 순서가 절대 중요하면 해당 Key의 후속 처리 정책을 따로 정해야 합니다. DLQ는 묘지가 아니라 알람, 수정, 안전한 Replay 절차가 있는 운영 큐여야 합니다.","easy":"","caution":""},{"id":"KAFKA-13","priority":2,"domain":"Kafka","topic":"전달 보장과 장애","question":"Broker 장애 시 Partition Leader와 Replica는 어떻게 복구되나요?","answer":"Partition Leader가 장애 나면 Controller가 ISR 중 하나를 새 Leader로 선출하고 Producer와 Consumer가 Metadata를 갱신해 연결합니다. ISR 밖 Replica를 Leader로 허용하는 Unclean Election은 가용성을 높일 수 있지만 복제되지 않은 데이터를 잃을 수 있습니다. Replica 분산, 충분한 ISR, Rack/AZ Awareness와 Leader Election 시간을 모니터링해야 합니다.","easy":"","caution":""},{"id":"KAFKA-14","priority":3,"domain":"Kafka","topic":"소비와 확장","question":"Consumer Rebalancing이 무엇이고 왜 문제가 될 수 있나요?","answer":"Group의 Consumer 수나 Topic Partition이 바뀔 때 Partition 소유권을 다시 나누는 과정입니다. Rebalance 동안 소비가 멈추거나 처리 중인 작업이 중복될 수 있고 Cache도 다시 데워야 합니다. 처리 시간을 `max.poll.interval.ms` 안에 맞추고, Static Membership과 Cooperative Sticky Assignor, 적절한 종료 처리로 이동 범위와 중단을 줄입니다.","easy":"","caution":""},{"id":"KAFKA-15","priority":3,"domain":"Kafka","topic":"소비와 확장","question":"Consumer Lag이 늘어날 때 어떤 순서로 진단하나요?","answer":"먼저 전체가 느린지 특정 Partition만 느린지와 유입률 대비 처리율을 봅니다. Consumer 오류·GC·CPU, 외부 DB/API 지연, Batch 크기와 처리 시간, Rebalance, Network, Hot Partition을 확인합니다. 일시 폭증이면 처리량을 늘리거나 따라잡을 시간을 계산하고, 구조적 병목이면 Partition과 Consumer 확장 전에 Downstream이 감당할 수 있는지 확인합니다.","easy":"","caution":""},{"id":"KAFKA-16","priority":2,"domain":"Kafka","topic":"소비와 확장","question":"Consumer 수를 Partition 수보다 많이 늘리면 어떻게 되나요?","answer":"같은 Consumer Group에서는 한 Partition을 동시에 한 Consumer만 담당하므로 초과 Consumer는 할당받지 못하고 유휴 상태가 됩니다. 소비 병렬성의 상한은 기본적으로 Partition 수입니다. 더 늘리려면 Partition을 추가할 수 있지만 Key 매핑과 운영 비용, 기존 순서 의미가 달라질 수 있습니다.","easy":"","caution":""},{"id":"KAFKA-17","priority":2,"domain":"Kafka","topic":"소비와 확장","question":"Hot Partition이 생기는 원인과 해결 방법을 설명해 주세요.","answer":"특정 Key가 지나치게 많거나 Partition 전략이 불균등하면 한 Partition의 Producer 지연과 Consumer Lag만 커집니다. 업무상 순서가 꼭 필요한 범위를 다시 정의해 Key를 세분화하거나 Salt를 붙여 분산하고 Downstream에서 합칠 수 있습니다. 단순히 Partition을 늘려도 같은 Key는 한 곳에 가므로 Key 분포를 먼저 고쳐야 합니다.","easy":"","caution":""},{"id":"KAFKA-18","priority":3,"domain":"Kafka","topic":"소비와 확장","question":"Kafka가 높은 처리량을 내는 이유를 설명해 주세요.","answer":"디스크에 무작위 갱신보다 순차 Append하고 OS Page Cache를 적극 활용합니다. Producer와 Consumer가 Record를 Batch로 묶고 압축해 네트워크 왕복을 줄이며, Zero-Copy 전송으로 불필요한 복사를 줄일 수 있습니다. Partition 단위 병렬 처리와 Pull 기반 Consumer도 처리량 조절에 유리합니다.","easy":"","caution":""},{"id":"KAFKA-19","priority":2,"domain":"Kafka","topic":"소비와 확장","question":"Batch Size, Linger, Compression을 어떻게 조정하나요?","answer":"`batch.size`와 `linger.ms`를 키우면 더 많은 Record를 한 번에 보내 압축률과 처리량이 좋아지지만 대기 지연과 메모리가 늘어납니다. Compression은 네트워크와 디스크를 절약하지만 Producer/Consumer CPU를 사용하며 같은 Batch의 유사 데이터가 많을수록 효과적입니다. 평균이 아니라 Peak에서의 P99 지연, 처리량, CPU, Request 크기를 함께 측정해 조정합니다.","easy":"","caution":""},{"id":"KAFKA-20","priority":3,"domain":"Kafka","topic":"데이터 수명과 시스템 설계","question":"Retention과 Log Compaction의 차이를 설명해 주세요.","answer":"Retention은 시간이나 크기 기준으로 오래된 Log Segment를 제거해 이벤트 이력을 일정 기간 보존합니다. Log Compaction은 Key별 가장 최신 Value를 남겨 상태를 복원할 수 있게 하며 Tombstone으로 삭제를 표현합니다. 둘은 함께 설정할 수 있고 Compaction도 즉시 실행되는 것이 아니므로 Consumer가 모든 중간 이벤트를 영구히 볼 수 있다고 가정하면 안 됩니다.","easy":"","caution":""},{"id":"KAFKA-21","priority":3,"domain":"Kafka","topic":"데이터 수명과 시스템 설계","question":"이벤트 스키마를 하위 호환되게 변경하는 방법을 설명해 주세요.","answer":"Event에 명시적 버전을 두고 Schema Registry와 Avro/Protobuf/JSON Schema로 호환 규칙을 검사합니다. 기존 Consumer가 모르는 선택 필드를 추가할 때는 기본값을 제공하고, 필드 삭제·타입 변경·의미 변경은 단계적으로 진행합니다. Producer를 먼저 바꿀지 Consumer를 먼저 바꿀지 Backward/Forward Compatibility 계약으로 정하고 실제 구버전 Contract Test를 둡니다.","easy":"","caution":""},{"id":"KAFKA-22","priority":3,"domain":"Kafka","topic":"데이터 수명과 시스템 설계","question":"Transactional Outbox 패턴이 무엇이고 왜 필요한가요?","answer":"업무 DB 변경과 발행할 Event를 같은 로컬 DB Transaction에서 Outbox 테이블에 함께 기록하는 패턴입니다. 별도 Publisher나 CDC가 Outbox를 Kafka로 전송해 “DB는 커밋됐지만 Event 발행은 실패”하는 Dual Write 문제를 줄입니다. 전송은 중복될 수 있으므로 Event ID, 멱등 Consumer, Outbox 정리와 지연 모니터링이 필요합니다.","easy":"","caution":""},{"id":"KAFKA-23","priority":2,"domain":"Kafka","topic":"데이터 수명과 시스템 설계","question":"Kafka에서 과거 이벤트를 Replay할 때 주의할 점은 무엇인가요?","answer":"새 Consumer Group이나 Offset 재설정으로 과거 이벤트를 다시 읽을 수 있지만, 외부 알림·결제 같은 부수 효과가 다시 실행되지 않도록 Replay Mode와 멱등성을 준비해야 합니다. 당시 스키마와 참조 데이터, Event Time을 재현할 수 있어야 하고 실시간 트래픽을 압도하지 않도록 Quota와 별도 Consumer를 둡니다. 진행률, 결과 검증, 중단·재개 절차도 필요합니다.","easy":"","caution":""},{"id":"KAFKA-24","priority":2,"domain":"Kafka","topic":"데이터 수명과 시스템 설계","question":"Kafka, SQS 같은 Queue, Redis Streams를 어떤 기준으로 선택하나요?","answer":"긴 보존, Replay, 다수 독립 구독자, 매우 높은 Stream 처리량이 필요하면 Kafka가 적합합니다. 작업을 한 번 분배하고 관리형 운영·Visibility Timeout·DLQ가 중요하면 SQS 같은 Queue가 단순합니다. 이미 Redis를 운영하고 규모가 제한적이며 짧은 Stream과 Consumer Group이 필요하면 Redis Streams를 고려할 수 있지만 메모리 비용과 내구성·확장 한계를 평가합니다.","easy":"","caution":""},{"id":"KAFKA-25","priority":3,"domain":"Kafka","topic":"데이터 수명과 시스템 설계","question":"Kafka 운영에서 중요한 메트릭과 알람을 설명해 주세요.","answer":"Producer 오류·재시도·Record 지연과 전송률, Broker CPU·디스크·네트워크·Request Queue를 봅니다. Under-Replicated/Offline Partition, ISR 축소, Controller와 Leader Election은 내구성과 가용성 신호입니다. Consumer는 Partition별 Lag, 처리율, Rebalance, Commit 실패를 보고 디스크 사용량과 Retention 여유도 알람으로 관리합니다.","easy":"","caution":""},{"id":"JD-01","priority":3,"domain":"핵클 JD 예상 질문","topic":"SDK와 로컬 평가","question":"기능 플래그와 A/B 테스트 분배를 서버 API가 아니라 SDK 로컬에서 평가하는 이유는 무엇인가요?","answer":"기능 플래그와 실험 분배를 SDK 로컬에서 평가하면 매 요청의 네트워크 왕복이 없어 지연과 비용이 작고, 중앙 서버가 잠시 장애여도 마지막 설정으로 서비스를 계속할 수 있습니다. 대신 설정 전파가 즉시가 아니고 SDK 구현·버전 호환·메모리와 스레드 관리가 복잡해집니다. 따라서 Control Plane은 버전 있는 설정을 배포하고 Data Plane인 SDK는 검증된 Snapshot으로 빠르게 평가하도록 분리합니다.","easy":"","caution":""},{"id":"JD-02","priority":3,"domain":"핵클 JD 예상 질문","topic":"SDK와 로컬 평가","question":"SDK가 설정을 주기적으로 동기화할 때 최신성과 가용성의 균형을 어떻게 잡나요?","answer":"SDK는 시작 시 설정을 가져오고 일정 주기로 Version 또는 ETag를 확인해 변경분을 동기화합니다. 새 설정을 검증한 뒤에만 원자적으로 교체하고 실패하면 Last-Known-Good 설정을 유지하며 지수 Backoff와 Jitter로 재시도합니다. 긴급 Kill Switch에는 짧은 Polling이나 Push 경로를 제공하되, 동기화 장애가 고객 요청 경로를 막지 않게 합니다.","easy":"","caution":""},{"id":"JD-03","priority":3,"domain":"핵클 JD 예상 질문","topic":"SDK와 로컬 평가","question":"새 설정을 읽는 요청이 많은 SDK에서 설정 전체를 Thread-Safe하게 교체하는 방법을 설명해 주세요.","answer":"읽기마다 큰 Lock을 잡기보다 완성된 불변 설정 Snapshot을 별도 공간에서 만들고 검증한 뒤 `AtomicReference`나 `volatile` 참조를 한 번에 교체합니다. 요청은 시작할 때 참조 하나를 읽어 같은 Version의 설정만 사용하므로 중간 상태를 보지 않습니다. 부분 변경 가능한 Map을 여러 단계로 수정하는 방식은 혼합 Version과 Race를 만들기 쉽습니다.","easy":"","caution":""},{"id":"JD-04","priority":3,"domain":"핵클 JD 예상 질문","topic":"SDK와 로컬 평가","question":"상태를 가진 SDK Client를 Spring Singleton Bean으로 둘 때 무엇을 주의해야 하나요?","answer":"Spring Singleton은 인스턴스가 하나라는 뜻이지 자동 Thread-Safe를 뜻하지 않습니다. 공유 설정·이벤트 큐·통계의 가시성과 원자성을 보장하고, 사용자 요청별 변경 상태를 필드에 두지 않아야 합니다. Executor와 HTTP Client를 중복 생성하지 않고 애플리케이션 종료 시 `@PreDestroy`로 전송을 마무리하고 스레드·커넥션을 닫아야 합니다.","easy":"","caution":""},{"id":"JD-05","priority":3,"domain":"핵클 JD 예상 질문","topic":"SDK와 로컬 평가","question":"오래된 SDK와 새 서버를 동시에 지원하기 위한 호환성 전략을 설명해 주세요.","answer":"Protocol과 설정 Schema는 가능한 한 필드 추가 중심으로 진화시키고 새 필드는 기본값을 가져 구버전 SDK가 무시해도 안전하게 합니다. 서버는 지원 중인 SDK Version과 Capability를 알고 해당 버전이 이해할 수 있는 설정만 내려주며, 제거는 사용률 관찰과 충분한 Deprecation 기간 뒤에 합니다. 언어별 SDK에 같은 Golden Test Vector를 적용해 직렬화와 평가 결과도 Contract Test합니다.","easy":"","caution":""},{"id":"JD-06","priority":3,"domain":"핵클 JD 예상 질문","topic":"이벤트 수집과 비동기 처리","question":"SDK 이벤트 큐를 Bounded Queue로 만드는 이유와 큐가 가득 찼을 때의 정책을 설명해 주세요.","answer":"무제한 Queue는 전송이 느려질 때 메모리를 계속 먹어 고객 애플리케이션까지 OOM으로 죽일 수 있어 SDK Queue는 한도를 둬야 합니다. 가득 찼을 때 Block은 Event를 보존하지만 고객 요청 지연을 만들고, Drop은 요청을 보호하지만 데이터가 빠지며, Caller-Runs는 자연스러운 Backpressure지만 역시 지연을 전파합니다. Event 중요도와 SDK 계약에 따라 정책을 선택 가능하게 하고 Drop 수·Queue 사용률을 노출합니다.","easy":"","caution":""},{"id":"JD-07","priority":3,"domain":"핵클 JD 예상 질문","topic":"이벤트 수집과 비동기 처리","question":"이벤트를 N건 또는 T초마다 Batch 전송할 때 두 값의 Trade-Off를 설명해 주세요.","answer":"N을 키우면 요청 횟수와 Header 비용이 줄고 압축률이 좋아지지만 낮은 트래픽에서 전송이 늦고 장애 시 메모리 내 유실량이 커집니다. T를 줄이면 Freshness와 종료 시 유실 구간은 줄지만 작은 Batch가 많아집니다. `size >= N OR elapsed >= T`로 두 조건을 함께 사용하고 Payload Byte 한도, 네트워크 지연, 서버 수용 Batch 크기를 부하 테스트로 정합니다.","easy":"","caution":""},{"id":"JD-08","priority":3,"domain":"핵클 JD 예상 질문","topic":"이벤트 수집과 비동기 처리","question":"SDK가 종료될 때 이벤트 유실을 줄이기 위한 Graceful Shutdown을 설계해 주세요.","answer":"종료 신호를 받으면 새 Event 접수를 중단하거나 명시된 정책으로 제한하고, Queue의 남은 Event를 제한 시간 안에 Flush한 뒤 Dispatcher와 HTTP 자원을 닫습니다. Shutdown Hook이나 프레임워크 Lifecycle에 연결하되 무한 대기하지 않고 Flush 성공·실패·남은 Event 수를 기록합니다. Crash와 강제 종료는 막을 수 없으므로 중요한 Event는 로컬 Disk Buffer나 서버 측 중복 허용 재전송을 고려합니다.","easy":"","caution":""},{"id":"JD-09","priority":3,"domain":"핵클 JD 예상 질문","topic":"이벤트 수집과 비동기 처리","question":"전송 실패와 재시도가 있는 이벤트 파이프라인에서 중복 처리를 어떻게 막나요?","answer":"각 Event에 전역 또는 Tenant 범위의 고유 Event ID를 부여하고 Producer는 동일 ID로 재시도합니다. 수집 서버나 Consumer는 Unique Constraint, Dedup Store, 멱등 Upsert로 같은 Event의 효과를 한 번만 반영합니다. Dedup TTL은 최대 재시도·Replay 기간보다 길게 잡고, 정확한 중복 제거 비용이 너무 크면 업무별로 중복 허용과 근사 제거 범위를 정합니다.","easy":"","caution":""},{"id":"JD-10","priority":3,"domain":"핵클 JD 예상 질문","topic":"이벤트 수집과 비동기 처리","question":"초당 수십만 건의 Multi-Tenant 이벤트 수집 시스템을 설계해 주세요.","answer":"인증·Tenant Quota가 있는 Stateless Ingestion API가 Event를 빠르게 검증해 Kafka 같은 Broker에 기록하고, Consumer가 정규화·중복 제거 후 Object Storage 원본과 분석 저장소에 적재하도록 분리합니다. Partition Key는 Tenant와 순서 요구 단위를 함께 고려하고 Schema Registry, DLQ, Replay 경로를 둡니다. SLO는 수집 성공률·P99 응답·Broker 기록 내구성·조회 Freshness로 나누고 Tenant별 비용과 Lag를 관찰합니다.","easy":"","caution":""},{"id":"JD-11","priority":3,"domain":"핵클 JD 예상 질문","topic":"이벤트 수집과 비동기 처리","question":"특정 고객의 트래픽 폭주가 다른 고객에게 전파되지 않도록 어떻게 격리하나요?","answer":"Tenant별 인증, Rate Limit, 동시성·Queue·저장량 Quota를 두고 공정한 Scheduling으로 한 고객이 Worker를 독점하지 못하게 합니다. Partition을 Tenant 하나에 고정하면 큰 고객이 Hot Partition을 만들 수 있어 크기에 따라 Key를 분할하고, 초대형 고객은 전용 Partition·Consumer Pool로 격리할 수 있습니다. 메트릭과 알람도 Tenant Label을 가져야 원인 고객을 빠르게 식별할 수 있습니다.","easy":"","caution":""},{"id":"JD-12","priority":2,"domain":"핵클 JD 예상 질문","topic":"이벤트 수집과 비동기 처리","question":"늦게 도착하거나 순서가 뒤바뀐 이벤트를 집계할 때 어떻게 처리하나요?","answer":"수집 시각과 실제 발생 시각을 분리하고 Event Time 기준 Window와 허용 지연 Watermark를 정의합니다. Window가 닫힌 뒤 늦게 온 Event는 보정 Update나 별도 Late Stream으로 처리하고, 고유 ID와 업무 Version으로 중복·오래된 변경을 거부합니다. 완전한 전역 순서를 만들기보다 사용자·세션처럼 필요한 범위만 순서 Key로 묶습니다.","easy":"","caution":""},{"id":"JD-13","priority":3,"domain":"핵클 JD 예상 질문","topic":"이벤트 수집과 비동기 처리","question":"이벤트 스키마 변경과 Replay를 안전하게 운영하는 방법을 설명해 주세요.","answer":"Event Schema를 Registry에서 호환성 검사하고 새 선택 필드는 기본값과 함께 추가합니다. 원본 Event는 변경 없이 보존하고 변환 로직과 파생 Dataset에 Version을 부여해 새 Consumer가 과거 원본을 다시 계산할 수 있게 합니다. Replay는 별도 Quota와 Consumer Group으로 실시간 파이프라인을 방해하지 않게 하며 부수 효과는 끄고 결과 수·Checksum을 검증합니다.","easy":"","caution":""},{"id":"JD-14","priority":3,"domain":"핵클 JD 예상 질문","topic":"A/B 테스트와 기능 플래그","question":"같은 사용자가 모든 SDK에서 항상 같은 실험 그룹을 받게 하려면 어떤 조건이 필요하나요?","answer":"동일한 Canonical User Identifier, Experiment Seed, Hash 알고리즘과 Byte Encoding, Slot 수와 구간 설정을 사용해야 합니다. Null·Unicode·숫자 문자열 처리까지 언어별로 같아야 하며 설정 Version도 일치해야 합니다. 서버가 제공하는 Golden Input/Output Vector를 모든 SDK의 Contract Test로 실행해 교차 언어 결정성을 검증합니다.","easy":"","caution":""},{"id":"JD-15","priority":3,"domain":"핵클 JD 예상 질문","topic":"A/B 테스트와 기능 플래그","question":"해시 기반 결정적 버케팅은 어떻게 동작하며 왜 실험 분배에 적합한가요?","answer":"Experiment Seed와 User ID를 합쳐 균등 분포 특성이 좋은 Hash를 계산하고 고정 Slot 범위에 매핑합니다. 각 Variation이 소유한 Slot 구간으로 그룹을 결정하므로 같은 입력은 항상 같은 결과를 받아 Sticky Assignment가 됩니다. 암호학적 보안보다 빠른 계산, 안정된 결과, 충분한 분포가 중요하지만 식별자 조작이 보안 문제가 되면 별도 신뢰 경계가 필요합니다.","easy":"","caution":""},{"id":"JD-16","priority":2,"domain":"핵클 JD 예상 질문","topic":"A/B 테스트와 기능 플래그","question":"실험 비율을 50:50에서 90:10으로 바꿀 때 기존 사용자 재배정을 어떻게 최소화하나요?","answer":"고정된 10,000개 같은 Slot 공간에서 기존 Variation 구간을 유지하고, 비율 증가에 꼭 필요한 인접 Slot만 다른 그룹에서 이동합니다. 50:50에서 90:10이면 최소한 40%의 Slot은 B에서 A로 이동해야 하지만 나머지 사용자는 그대로 둘 수 있습니다. 장기 Sticky Assignment가 더 중요하면 최초 배정을 저장하되 저장 비용과 신규 비율 수렴 속도의 대가를 설명합니다.","easy":"","caution":""},{"id":"JD-17","priority":3,"domain":"핵클 JD 예상 질문","topic":"A/B 테스트와 기능 플래그","question":"사용자가 그룹에 배정된 것과 실제 기능에 노출된 것을 왜 구분해야 하나요?","answer":"그룹 배정만 됐어도 사용자가 해당 화면에 들어오지 않거나 기능을 실제로 보지 않을 수 있습니다. 배정 시점을 분모로 쓰면 실험 효과가 희석되거나 노출 조건에 따른 편향이 생길 수 있어 실제 평가 지점에서 Exposure Event를 기록합니다. 중복 Exposure, Bot, 내부 사용자, 사용자 식별 변경도 분석 전에 정리해야 합니다.","easy":"","caution":""},{"id":"JD-18","priority":3,"domain":"핵클 JD 예상 질문","topic":"A/B 테스트와 기능 플래그","question":"Sample Ratio Mismatch가 발생하면 어떤 순서로 원인을 조사하나요?","answer":"먼저 기대 비율과 실제 분배 차이가 통계적으로 우연 범위를 넘는지, 특정 기간·SDK·플랫폼·Tenant에 집중되는지 확인합니다. 그다음 Hash/Slot 설정과 SDK Version, 식별자 Null·중복, Exposure 로깅 실패, 수집 Drop, 필터 조건과 Bot을 순서대로 봅니다. 분배 문제와 측정 파이프라인 문제를 분리하고 원본 Event부터 단계별 Count를 대조합니다.","easy":"","caution":""},{"id":"JD-19","priority":2,"domain":"핵클 JD 예상 질문","topic":"A/B 테스트와 기능 플래그","question":"기능 플래그의 점진 출시와 Kill Switch를 안전하게 설계하는 방법을 설명해 주세요.","answer":"내부 사용자와 작은 비율부터 시작해 오류율·P99·업무 Guardrail을 확인하며 단계적으로 확대하고, 각 단계의 자동 중단 기준을 정합니다. 설정은 Version과 감사 로그를 갖고 원자적으로 Publish하며 즉시 이전 Version으로 Rollback할 수 있어야 합니다. Kill Switch는 의존 서비스가 불안정할 때도 빠르게 평가돼야 하므로 마지막 안전 설정과 SDK 전파 지연을 고려합니다.","easy":"","caution":""},{"id":"JD-20","priority":3,"domain":"핵클 JD 예상 질문","topic":"Reactive, Coroutine, 고가용성","question":"Reactive Streams의 Backpressure가 무엇이고 이벤트 파이프라인에서 왜 필요한가요?","answer":"Backpressure는 Consumer가 처리할 수 있는 양만 `request(n)`으로 Producer에 요구해 무제한 Buffer와 OOM을 막는 흐름 제어입니다. 이벤트 수집에서는 Downstream DB가 느려질 때 수집 속도를 그대로 밀어 넣지 않고 Buffer, 제한, Drop, Retry 중 정책을 적용하게 합니다. 단순히 비동기라는 뜻이 아니며 전체 경로에 Blocking 구간이 있으면 별도 Scheduler와 용량 경계를 둬야 합니다.","easy":"","caution":""},{"id":"JD-21","priority":2,"domain":"핵클 JD 예상 질문","topic":"Reactive, Coroutine, 고가용성","question":"Kotlin Coroutine이 Thread보다 가볍다는 말의 정확한 의미는 무엇인가요?","answer":"Coroutine은 대기 중 실행 상태를 객체로 저장하고 소수 Thread 위에서 중단·재개할 수 있어 요청마다 OS Thread와 큰 Stack을 점유하는 것보다 비용이 작다는 뜻입니다. CPU 작업 자체가 공짜이거나 여러 Coroutine이 한 Thread에서 동시에 실행된다는 뜻은 아닙니다. Suspend 가능한 비동기 API를 사용할 때 특히 많은 I/O 동시성을 효율적으로 표현합니다.","easy":"","caution":""},{"id":"JD-22","priority":2,"domain":"핵클 JD 예상 질문","topic":"Reactive, Coroutine, 고가용성","question":"Coroutine에서 Blocking I/O를 잘못 호출하면 어떤 문제가 생기나요?","answer":"`Dispatchers.Default` 같은 제한된 CPU Thread Pool에서 Blocking I/O를 호출하면 Thread가 대기하는 동안 다른 Coroutine도 실행하지 못해 Pool Starvation과 지연이 발생합니다. Blocking 호출은 `Dispatchers.IO`나 별도 제한 Pool로 격리하고 가능하면 Suspend 기반 Client를 사용합니다. Timeout, Cancellation과 ThreadLocal Context 전파도 경계에서 확인합니다.","easy":"","caution":""},{"id":"JD-23","priority":3,"domain":"핵클 JD 예상 질문","topic":"Reactive, Coroutine, 고가용성","question":"핵클과 같은 시스템에서 어떤 SLO를 정의하고 우선순위를 어떻게 정하겠어요?","answer":"SDK 평가는 고객 요청 경로이므로 매우 낮은 P99 지연과 높은 로컬 가용성을, 설정 배포는 Freshness와 성공률을, 이벤트 수집은 수락 성공률·내구성·최대 Lag를 따로 정의합니다. 모든 지표를 동시에 최대로 만들 수 없으므로 고객 기능을 막지 않는 평가 가용성을 우선하고, 분석 Event는 허용 가능한 유실률과 지연을 명시합니다. SLO에는 측정 지점과 Error Budget, 초과 시 중단할 출시 정책까지 연결합니다.","easy":"","caution":""},{"id":"JD-24","priority":3,"domain":"핵클 JD 예상 질문","topic":"Reactive, Coroutine, 고가용성","question":"한 AZ, Broker 또는 DB가 장애를 일으켜도 핵심 기능을 유지하려면 어떻게 설계하나요?","answer":"Stateless API를 여러 AZ에 분산하고 Health 기반 Load Balancing을 사용합니다. Kafka와 DB는 AZ를 나눈 Replica와 자동 Failover를 구성하되 Replication Lag과 쓰기 일관성 대가를 정합니다. 중앙 Control Plane 장애 때도 SDK는 Last-Known-Good 설정으로 평가하고, 이벤트는 제한된 로컬/브로커 Buffer로 흡수해 핵심 기능과 분석 기능의 장애를 분리합니다.","easy":"","caution":""},{"id":"JD-25","priority":2,"domain":"핵클 JD 예상 질문","topic":"Reactive, Coroutine, 고가용성","question":"Kubernetes의 Readiness, Liveness, Startup Probe를 어떻게 구분해 사용하나요?","answer":"Startup Probe는 초기화가 긴 애플리케이션이 시작하기 전 Liveness에 죽지 않게 합니다. Readiness는 현재 트래픽을 받을 준비가 됐는지를 판단해 실패하면 Service Endpoint에서 제외하고, Liveness는 프로세스가 복구 불가능하게 멈췄는지 판단해 재시작합니다. DB가 잠깐 느리다는 이유로 모든 Pod의 Liveness를 실패시키면 장애를 키울 수 있어 의존성별 의미를 분리합니다.","easy":"","caution":""},{"id":"JD-26","priority":3,"domain":"핵클 JD 예상 질문","topic":"Reactive, Coroutine, 고가용성","question":"Kubernetes Rolling Update 중 요청과 이벤트를 유실하지 않는 종료 절차를 설명해 주세요.","answer":"새 Pod가 Startup과 Readiness를 통과한 뒤에만 트래픽을 받고, 종료 Pod는 먼저 Readiness를 내려 새 요청 유입을 끊습니다. `preStop`과 충분한 `terminationGracePeriodSeconds` 동안 진행 중 요청을 완료하고 Consumer Partition을 반납하며 Buffer Event와 Offset을 안전하게 Flush합니다. Load Balancer 전파 지연, SIGTERM 처리, PodDisruptionBudget과 실제 종료 시간을 배포 테스트로 검증합니다.","easy":"","caution":""},{"id":"JD-27","priority":3,"domain":"핵클 JD 예상 질문","topic":"JD·경험 연결형","question":"Java/Spring 시스템에서 성능 또는 정합성 문제를 발견하고 해결한 경험을 설명해 주세요.","answer":"이 질문은 꾸며낸 기술 지식보다 실제 한 사례의 증거가 중요합니다. `사용자 영향과 수치 → 로그·프로파일·실행 계획으로 확인한 원인 → 검토한 대안 → 내가 선택한 변경 → 같은 조건의 전후 결과 → 남은 한계와 재발 방지` 순서로 답합니다. “쿼리를 튜닝했다”보다 스캔 행 수, 지연 백분위, Lock 범위처럼 판단 근거를 말해야 합니다.","easy":"무엇을 고쳤는지보다 어떻게 원인을 좁히고 선택이 맞았음을 증명했는지를 보여주는 질문입니다.","caution":""},{"id":"JD-28","priority":3,"domain":"핵클 JD 예상 질문","topic":"JD·경험 연결형","question":"Redis·Kafka 같은 기술을 “유명해서”가 아니라 접근 패턴과 장애 모델을 기준으로 선택하는 과정을 설명해 주세요.","answer":"먼저 데이터의 원본 여부, 접근 패턴, 순서·재처리·일관성, 허용 지연, 장애 시 행동과 운영 역량을 정의합니다. 짧은 Key 조회와 TTL·원자 연산이면 Redis, 보존되는 이벤트 로그·Replay·다수 Consumer면 Kafka가 후보가 되며 단순한 RDB나 관리형 Queue로 충분한지도 비교합니다. 선택하지 않은 대안과 실패 모드, 측정할 지표까지 말해야 기술 이름 나열을 벗어납니다.","easy":"","caution":""},{"id":"JD-29","priority":3,"domain":"핵클 JD 예상 질문","topic":"JD·경험 연결형","question":"고객 요구와 기술적으로 더 완벽한 설계가 충돌했을 때 어떻게 결정했나요?","answer":"실제 사례를 `고객이 지금 겪는 손실 → 완벽한 안과 빠른 안의 비용·위험 → 되돌릴 수 있는 최소 해결책 → 성공/중단 지표 → 후속 개선` 순서로 답합니다. 빠른 안을 골랐다면 안전장치와 갚을 기술부채를, 긴 안을 골랐다면 지금 투자해야만 했던 비가역 위험을 설명합니다. 속도나 완성도 자체가 아니라 고객 Impact 대비 투자로 판단했음을 보여줍니다.","easy":"","caution":""},{"id":"JD-30","priority":3,"domain":"핵클 JD 예상 질문","topic":"JD·경험 연결형","question":"설계에 강한 의견을 냈지만 다른 근거를 보고 의견을 바꾼 경험을 설명해 주세요.","answer":"`처음 주장과 근거 → 상대가 제시한 반대 근거 → 논쟁 대신 합의한 검증 방법 → 결과를 보고 바꾼 결정 → 바뀐 실행에 내가 기여한 행동` 순서로 답합니다. 처음 의견이 틀렸다는 고백만으로 끝내지 않고, 불확실성을 데이터로 줄이고 결정 후에는 한 팀으로 실행했다는 점을 보여줍니다. 반대로 의견을 유지했다면 무엇이 반증되면 바꿀지도 말할 수 있어야 합니다.","easy":"","caution":""},{"id":"JD-31","priority":3,"domain":"핵클 JD 예상 질문","topic":"Spring, ORM, NoSQL, 서비스 운영","question":"Spring의 `@Transactional`이 적용되지 않는 대표적인 경우를 설명해 주세요.","answer":"기본 Proxy 방식에서는 같은 객체 내부에서 `this`로 호출하는 Self-Invocation이 Proxy를 거치지 않아 Transaction Advice가 적용되지 않습니다. `private` 메서드처럼 Proxy가 가로챌 수 없는 호출, Spring이 관리하지 않는 객체, 잘못된 예외 Rollback 규칙도 대표 원인입니다. 비동기나 Coroutine으로 실행 경계가 다른 Thread·Context로 넘어가면 기존 Transaction이 자동 전파된다고 가정하면 안 됩니다.","easy":"","caution":""},{"id":"JD-32","priority":3,"domain":"핵클 JD 예상 질문","topic":"Spring, ORM, NoSQL, 서비스 운영","question":"JPA N+1 문제를 어떻게 발견하고 해결하나요?","answer":"목록 한 번을 조회한 뒤 연관 Entity마다 추가 Query가 반복되는 현상으로 SQL 로그, Query Count Test, APM에서 발견합니다. 한 연관을 함께 가져오면 Fetch Join이나 Entity Graph를, 여러 컬렉션과 Pagination 제약이 있으면 Batch Fetch나 필요한 값만 조회하는 DTO Projection을 고려합니다. 무조건 Eager로 바꾸기보다 화면별 조회 모양을 명시하고 실제 Query 수와 결과 건수를 검증합니다.","easy":"","caution":""},{"id":"JD-33","priority":3,"domain":"핵클 JD 예상 질문","topic":"Spring, ORM, NoSQL, 서비스 운영","question":"실험 상태를 DRAFT에서 RUNNING으로 바꾸는 동시 요청을 어떻게 제어하나요?","answer":"DRAFT에서 RUNNING으로 갈 수 있다는 상태 전이 규칙을 Domain 안에 두고 DB에서 한 번만 성공하도록 보장합니다. 충돌이 드물면 Version 컬럼의 낙관적 락이나 `UPDATE ... WHERE status='DRAFT'` 후 영향 행 수 확인이 적합하고, 여러 관련 행을 함께 잠가야 하면 비관적 락을 검토합니다. 중복 요청에는 Idempotency Key나 이미 완료된 결과 반환 정책을 둡니다.","easy":"","caution":""},{"id":"JD-34","priority":3,"domain":"핵클 JD 예상 질문","topic":"Spring, ORM, NoSQL, 서비스 운영","question":"실험 설정, 사용자 이벤트, 분석 결과를 RDB·Redis·Kafka·Object Storage 중 어디에 둘지 설명해 주세요.","answer":"실험 정의·권한·상태처럼 강한 정합성과 관계가 필요한 Control Data는 RDB에 둡니다. 매우 자주 읽는 배포 설정 Snapshot은 Redis나 SDK 로컬 캐시, 대량 Event 전달과 Replay는 Kafka, 변경하지 않는 원본 Event의 장기 보존은 Object Storage가 적합합니다. 분석 결과는 조회 패턴에 맞는 OLAP/검색 저장소에 두며, 각 저장소의 원본 여부와 재생성 경로를 명확히 합니다.","easy":"","caution":""},{"id":"JD-35","priority":2,"domain":"핵클 JD 예상 질문","topic":"Spring, ORM, NoSQL, 서비스 운영","question":"Elasticsearch를 검색·집계에는 사용하면서 원본 저장소로는 조심해야 하는 이유는 무엇인가요?","answer":"Elasticsearch는 역색인과 분산 검색·집계에 강하지만 Refresh 전에는 새 문서가 검색에 보이지 않는 Near-Real-Time 시스템이고, Update·Delete와 강한 Transaction 제약이 RDB와 다릅니다. Mapping 변경, Segment Merge, Replica와 Cluster 복구도 운영 비용이 큽니다. 원본은 내구성과 정합성이 맞는 저장소에 두고 Elasticsearch는 Event나 CDC로 재구축 가능한 검색 Projection으로 사용하는 편이 안전합니다.","easy":"","caution":""},{"id":"JD-36","priority":3,"domain":"핵클 JD 예상 질문","topic":"Spring, ORM, NoSQL, 서비스 운영","question":"Microservice의 경계를 나누는 기준과 서비스 간 데이터 일관성을 설명해 주세요.","answer":"기술 계층보다 업무 Capability, 변경 주기, 데이터 소유권과 팀 책임을 기준으로 경계를 나눕니다. 각 서비스가 자기 DB를 소유하고 다른 서비스가 내부 Table을 직접 수정하지 않게 합니다. 서비스 간 원자 Transaction 대신 Saga, Outbox, 멱등 Event로 최종 일관성을 관리하며, 강한 일관성이 계속 필요한 데이터는 성급히 분리하지 않습니다.","easy":"","caution":""},{"id":"JD-37","priority":2,"domain":"핵클 JD 예상 질문","topic":"Spring, ORM, NoSQL, 서비스 운영","question":"동기 API와 비동기 이벤트 중 서비스 간 통신 방식을 어떤 기준으로 선택하나요?","answer":"호출 결과가 지금 바로 있어야 다음 결정을 할 수 있고 오류를 즉시 사용자에게 알려야 하면 동기 API가 단순합니다. 여러 Subscriber에게 사실을 전달하거나 호출자를 Downstream 지연과 장애에서 분리하고 Replay가 필요하면 비동기 Event가 유리합니다. 비동기는 지연·중복·순서와 관측 복잡성을, 동기는 시간 결합과 연쇄 장애를 대가로 가지므로 Timeout과 업무 완료 시점을 기준으로 선택합니다.","easy":"","caution":""},{"id":"JD-38","priority":3,"domain":"핵클 JD 예상 질문","topic":"Spring, ORM, NoSQL, 서비스 운영","question":"대용량 이벤트 시스템에서 로그, 메트릭, 트레이스를 어떻게 연결해 장애를 진단하나요?","answer":"모든 요청과 Event에 Trace ID, Tenant ID, Event ID를 부여해 Ingestion부터 Broker, Consumer, 저장소까지 같은 문맥으로 연결합니다. 메트릭으로 오류율·P99·처리량·Lag의 이상을 발견하고 Trace로 느린 구간을 좁힌 뒤 구조화 로그로 입력과 결정 원인을 확인합니다. 고유 ID 같은 고카디널리티 값은 메트릭 Label에 넣지 않고 Trace나 Log에서 조회합니다.","easy":"","caution":""},{"id":"JD-39","priority":3,"domain":"핵클 JD 예상 질문","topic":"제품·Fit 예상 질문","question":"왜 핵클이며, 핵클의 어떤 고객 문제를 풀고 싶나요?","answer":"회사 이름이나 A/B 테스트에 대한 막연한 흥미가 아니라 `행동 데이터 수집 → 분석 → 실험·기능 출시 → CRM → 성과 측정`의 닫힌 고리에서 어떤 고객 문제에 끌리는지 답합니다. 이어서 그 문제에 내 Java/Spring, 성능·정합성, 내부 플랫폼 경험 중 무엇을 바로 기여할지 연결합니다. 마지막에는 대용량 이벤트나 SDK처럼 입사 후 더 깊게 풀고 싶은 구체 영역을 한 가지 말합니다.","easy":"","caution":""},{"id":"JD-40","priority":3,"domain":"핵클 JD 예상 질문","topic":"제품·Fit 예상 질문","question":"제한된 시간 때문에 좋은 기능 하나를 포기하고 더 중요한 목표를 선택한 경험을 설명해 주세요.","answer":"실제 사례를 `전체 목표와 마감 → 후보 작업별 Impact와 비용 → 포기한 기능과 감수한 위험 → 선택한 핵심 범위 → 결과와 후속 처리`로 답합니다. 단순히 시간이 없었다가 아니라 어떤 기준으로 고객 가치가 작은 일을 버렸는지 보여줍니다. 포기한 항목 때문에 생길 위험을 문서화하고 다시 판단할 시점도 정했다면 더 좋습니다.","easy":"","caution":""},{"id":"JD-41","priority":3,"domain":"핵클 JD 예상 질문","topic":"제품·Fit 예상 질문","question":"직관과 데이터가 충돌해 판단을 바꾼 경험을 설명해 주세요.","answer":"처음의 가설과 그 근거를 솔직히 말한 뒤, 어떤 지표나 실험이 예상과 달랐고 왜 믿을 만했는지 설명합니다. 그 데이터를 보고 결정·우선순위·설계를 어떻게 바꿨으며 결과가 어땠는지 연결합니다. 데이터가 완전하지 않았다면 한계와 추가로 확인한 Guardrail도 함께 말합니다.","easy":"","caution":""},{"id":"JD-42","priority":2,"domain":"핵클 JD 예상 질문","topic":"제품·Fit 예상 질문","question":"내 작업의 위험이나 지연을 관계자에게 빠르게 공유한 경험을 설명해 주세요.","answer":"위험을 처음 감지한 신호, 전체 일정과 고객에 미칠 영향, 아직 모르는 부분을 분리해 어떻게 공유했는지 답합니다. 문제만 던지기보다 가능한 선택지와 필요한 결정 시점, 다음 업데이트 시간을 함께 제시합니다. 조기 공유로 범위·일정·지원 인력이 어떻게 조정됐는지 결과까지 연결합니다.","easy":"","caution":""},{"id":"JD-43","priority":2,"domain":"핵클 JD 예상 질문","topic":"제품·Fit 예상 질문","question":"익숙하지 않은 기술을 짧은 시간에 학습해 실제 결과를 만든 경험을 설명해 주세요.","answer":"기술 이름보다 `해결해야 했던 실제 문제 → 필요한 최소 학습 범위 → 공식 문서·작은 실험 → 안전한 적용 → 측정 결과 → 이후 보완한 이해` 순서로 답합니다. 모르는 부분을 숨기지 않고 위험이 큰 가정은 Spike나 Test로 먼저 검증했음을 보여줍니다. 학습 결과가 문서·테스트·공통 도구로 남아 팀에도 재사용됐으면 함께 말합니다.","easy":"","caution":""},{"id":"JD-44","priority":2,"domain":"핵클 JD 예상 질문","topic":"JD 우대 스택 선택 기준","question":"MongoDB는 어떤 데이터와 접근 패턴에 적합하며 RDBMS와 어떻게 다른가요?","answer":"MongoDB는 한 Aggregate를 Document 하나로 읽고 쓰며 필드 구조가 자주 확장되는 데이터, 고정된 접근 패턴과 수평 분산에 적합합니다. RDBMS는 관계, Join, 제약 조건과 복잡한 Transaction이 중요한 데이터에 강합니다. MongoDB도 Transaction과 Index를 지원하지만 Embedding/Reference, Document 크기, Shard Key를 조회 패턴부터 설계해야 하며 “Schema가 없다”가 아니라 Schema를 애플리케이션이 관리한다고 보는 편이 정확합니다.","easy":"","caution":""},{"id":"JD-45","priority":2,"domain":"핵클 JD 예상 질문","topic":"JD 우대 스택 선택 기준","question":"Kafka, SQS, Kinesis를 어떤 기준으로 선택하나요?","answer":"Kafka는 긴 보존·Replay·여러 독립 Consumer와 직접 운영/세밀한 제어가 필요할 때 적합합니다. SQS는 작업 Queue를 관리형으로 빠르게 운영하고 Visibility Timeout과 DLQ로 Consumer를 분리할 때 단순합니다. Kinesis는 AWS 안에서 Shard 기반 Event Stream과 관리형 연동이 중요할 때 후보가 됩니다. 순서 범위, 보존 기간, Replay, 처리량, 운영 인력, 다른 AWS 서비스와의 결합 비용으로 비교합니다.","easy":"","caution":""},{"id":"JD-46","priority":2,"domain":"핵클 JD 예상 질문","topic":"JD 우대 스택 선택 기준","question":"Docker Image를 안전하고 재현 가능하게 만들 때 무엇을 주의하나요?","answer":"Base Image와 Dependency Version을 고정하고 Multi-Stage Build로 실행에 필요한 파일만 넣어 Image를 작게 만듭니다. Root가 아닌 사용자, 읽기 전용 파일 시스템, Secret 미포함, 취약점 Scan과 SBOM으로 공급망 위험을 줄입니다. 같은 Source와 Lockfile로 같은 결과를 만들고, Image는 환경별로 다시 Build하지 않고 설정만 주입해 한 Artifact를 승격합니다.","easy":"","caution":""},{"id":"JD-47","priority":2,"domain":"핵클 JD 예상 질문","topic":"JD 우대 스택 선택 기준","question":"AWS에서 이벤트 수집 시스템을 Multi-AZ로 설계한다면 주요 구성과 장애 경계를 설명해 주세요.","answer":"Multi-AZ Load Balancer 뒤에 Stateless Ingestion Service를 분산하고, Event는 MSK/Kinesis 같은 AZ 복제 Stream에 먼저 내구성 있게 기록합니다. 원본은 S3에 보존하고 DB는 Multi-AZ 구성과 명확한 Failover 정책을 사용하며 Consumer는 AZ별로 분산합니다. 한 AZ 장애 시 목표 처리량과 Buffer 시간을 계산하고 NAT, AZ 간 전송, IAM, Retry 폭주가 새로운 단일 장애점이 되지 않는지 확인합니다.","easy":"","caution":""}];

      'Consumer Group': 'Partition을 나눠 읽는 Consumer들의 한 논리적 구독자',
      'ISR': 'Kafka Leader를 충분히 따라온 동기화 Replica 집합',
      'DLQ': '반복 처리할 수 없는 실패 메시지를 조사하도록 격리하는 큐',
      'Idempotency': '같은 요청을 여러 번 처리해도 최종 결과가 한 번과 같게 하는 성질',
      'Outbox': 'DB 변경과 발행할 이벤트를 같은 DB Transaction에 기록하는 패턴',
      'Backpressure': '소비자가 감당할 수 있는 양만 생산자에게 요청하는 흐름 제어',
      'SDK': '다른 개발자가 제품 기능을 코드에서 쉽게 쓰도록 제공하는 라이브러리',
      'Snapshot': '한 시점의 완성된 상태를 통째로 고정한 사본',
      'SLO': '사용자에게 제공하겠다고 내부적으로 정한 신뢰성 목표',
      'Kubernetes': 'Container 실행·배포·복구를 여러 서버에서 조정하는 플랫폼',
      'Readiness': '현재 새 트래픽을 받을 준비가 됐는지 나타내는 상태',
      'Liveness': '프로세스를 재시작해야 할 만큼 멈췄는지 나타내는 상태',
      'Coroutine': '대기할 때 Thread를 점유하지 않고 중단·재개할 수 있는 실행 단위',
      'Reactive Streams': '비동기 데이터 흐름과 Backpressure 계약을 정의한 표준',
      'ORM': '객체와 관계형 DB 행을 서로 연결해 주는 계층',
      'N+1': '목록 한 번 뒤 항목 수만큼 연관 Query가 반복되는 문제',
      'Trace': '한 요청이 여러 서비스와 작업을 지나간 전체 경로 기록',
      'Tenant': '하나의 SaaS를 독립적으로 사용하는 고객 조직',
      'A/B': '사용자를 여러 그룹으로 나눠 변화의 효과를 비교하는 실험',
      'Feature Flag': '배포한 기능의 노출 여부를 설정으로 제어하는 스위치',
      'RDBMS': '관계와 제약 조건을 Table로 관리하고 SQL로 조회하는 데이터베이스',
      'MongoDB': '관련 데이터를 JSON과 비슷한 Document 단위로 저장하는 데이터베이스',
      'Elasticsearch': '역색인을 사용해 검색과 집계를 빠르게 수행하는 분산 검색 엔진',
      'SQS': 'AWS가 운영해 주는 작업 메시지 Queue 서비스',
      'Kinesis': 'AWS에서 Shard 단위로 Event Stream을 수집·처리하는 서비스',
      'Docker': '애플리케이션과 실행 환경을 Image로 묶어 격리 실행하는 도구',
      'AWS': '컴퓨팅·저장·네트워크 서비스를 필요할 때 빌려 쓰는 Cloud 플랫폼',
      'MSA': '업무 경계를 기준으로 독립 배포 가능한 작은 서비스로 나누는 구조'
    };
    const state = {
      domain: '전체',
      priority: 0,
      query: '',
      view: 'list',
      practiceIndex: 0,
      practiceAnswerVisible: false,
      progress: JSON.parse(localStorage.getItem('cs-interview-progress') || '{}')
    };

    const domainNames = ['전체', ...new Set(DATA.map((item) => item.domain))];
    const domainList = document.getElementById('domain-list');
    const questionsRoot = document.getElementById('questions');
    const resultCount = document.getElementById('result-count');
    const listView = document.getElementById('list-view');
    const practiceView = document.getElementById('practice-view');
    const practiceStage = document.getElementById('practice-stage');

    function escapeHtml(value = '') {
      return value.replace(/[&<>'"]/g, (character) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]);
    }

    function splitSentences(text) {
      return text.split(/(?<=[가-힣][.!?])\s+/u).map((value) => value.trim()).filter(Boolean);
    }

    function glossaryFor(item) {
      const haystack = [item.question, item.answer].join(' ').toLocaleLowerCase('ko');
      const hasBoundedTerm = (term) => {
        const target = term.toLocaleLowerCase('ko');
        let index = haystack.indexOf(target);
        while (index >= 0) {
          const before = haystack[index - 1] ?? '';
          const after = haystack[index + target.length] ?? '';
          if (!/[A-Za-z0-9]/.test(before) && !/[A-Za-z0-9]/.test(after)) return true;
          index = haystack.indexOf(target, index + 1);
        }
        return false;
      };
      return Object.entries(GLOSSARY)
        .sort(([left], [right]) => right.length - left.length)
        .filter(([term]) => hasBoundedTerm(term))
        .slice(0, 5);
    }

    function filteredData() {
      const query = state.query.trim().toLocaleLowerCase('ko');
      return DATA.filter((item) => {
        const domainMatches = state.domain === '전체' || item.domain === state.domain;
        const priorityMatches = state.priority === 0 || item.priority === state.priority;
        const haystack = [item.id, item.domain, item.topic, item.question, item.answer, item.easy].join(' ').toLocaleLowerCase('ko');
        return domainMatches && priorityMatches && (!query || haystack.includes(query));
      });
    }

    function renderDomains() {
      domainList.innerHTML = domainNames.map((name) => {
        const count = name === '전체' ? DATA.length : DATA.filter((item) => item.domain === name).length;
        return '<button class="domain-button ' + (state.domain === name ? 'active' : '') + '" data-domain="' + escapeHtml(name) + '"><span>' + escapeHtml(name) + '</span><span>' + count + '</span></button>';
      }).join('');
    }

    function statusButtons(item) {
      const status = state.progress[item.id] || '';
      return '<button class="status-button review" data-status="review" data-id="' + item.id + '" data-active="' + (status === 'review') + '">↺ 다시 보기</button>' +
        '<button class="status-button" data-status="done" data-id="' + item.id + '" data-active="' + (status === 'done') + '">✓ 이해했어요</button>';
    }

    function diagramFor(id) {
      if (id === 'OS-18') return '<div class="memory-map"><div><b>가상 페이지</b><div class="memory-column"><div class="page">P0</div><div class="page active">P1</div><div class="page">P2</div><div class="page">P3</div></div></div><div class="flow-arrow"><i class="packet"></i></div><div><b>물리 프레임</b><div class="memory-column"><div class="page">F7</div><div class="page">F2</div><div class="page active">F9</div><div class="page">F4</div></div></div></div><div class="legend">MMU가 페이지 테이블을 보고 P1을 F9로 번역합니다. 오프셋은 그대로 유지됩니다.</div>';
      if (id === 'OS-26') return '<div class="cycle"><svg viewBox="0 0 560 230" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="var(--orange)"/></marker></defs><path d="M330 55 Q470 70 435 145" marker-end="url(#arrow)"/><path d="M385 176 Q280 225 170 176" marker-end="url(#arrow)"/><path d="M125 142 Q86 65 230 52" marker-end="url(#arrow)"/></svg><div class="flow-node n1">작업 A<small>B의 락을 기다림</small></div><div class="flow-node n2">작업 B<small>C의 락을 기다림</small></div><div class="flow-node n3">작업 C<small>A의 락을 기다림</small></div></div><div class="legend">기다림이 원을 만들면 누구도 먼저 진행할 수 없습니다.</div>';
      if (id === 'NET-05' || id === 'NET-17') {
        const labels = id === 'NET-05' ? ['SYN','SYN + ACK','ACK'] : ['ClientHello + 키','인증서 + 서버 키','Finished'];
        return '<div class="lanes"><div class="lane-head"><span>클라이언트</span><span>서버</span></div>' + labels.map((label, index) => '<div class="message ' + (index % 2 ? 'reverse' : '') + '" data-label="' + label + '" style="--angle:' + (index % 2 ? '-3deg' : '3deg') + '"></div>').join('') + '</div><div class="legend">' + (id === 'NET-17' ? '인증과 키 합의가 끝난 뒤부터 빠른 대칭 키로 데이터를 암호화합니다.' : '양쪽이 서로의 송수신 준비와 초기 순서 번호를 확인합니다.') + '</div>';
      }
      if (id === 'DB-15') return '<div class="tree"><div class="tree-level"><div class="tree-node"><span>30</span><span class="hit">60</span></div></div><div>↙︎　　　　　↓　　　　　↘︎</div><div class="tree-level"><div class="tree-node"><span>10</span><span>20</span></div><div class="tree-node"><span>35</span><span class="hit">50</span></div><div class="tree-node"><span>70</span><span>90</span></div></div></div><div class="legend">한 페이지에 키를 많이 담아 높이를 낮추고, 정렬된 Leaf를 이어 범위도 빠르게 읽습니다.</div>';

      const flows = {
        'OS-01': [['실행 파일','디스크'],['프로세스 생성','PCB · 메모리'],['Ready Queue','CPU 대기'],['명령 실행','User / Kernel']],
        'OS-10': [['작업 A','실행 중'],['문맥 저장','PCB'],['스케줄러','다음 선택'],['작업 B','문맥 복원']],
        'JAVA-03': [['.java','소스'],['javac','.class'],['Class Loader','검증 · 로딩'],['JVM','해석 + JIT']],
        'JAVA-08': [['Eden','새 객체'],['Survivor','살아남음'],['Old','오래 생존'],['회수','Mark · Copy']],
        'DB-01': [['BEGIN','작업 시작'],['UPDATE','변경'],['로그 기록','복구 근거'],['COMMIT','영구 반영']],
        'DB-06': [['행 v1','과거 값'],['트랜잭션 A','스냅샷 읽기'],['행 v2','새 값'],['정리','독자 종료 후']],
        'NET-01': [['DNS','IP 찾기'],['TCP / QUIC','길 열기'],['TLS','신원 · 암호화'],['HTTP','요청 · 응답']],
        'REDIS-03': [['Socket','준비 이벤트'],['Event Loop','명령 선택'],['메모리','짧은 실행'],['응답','다음 연결']],
        'REDIS-10': [['요청','Key 조회'],['Redis Miss','값 없음'],['DB','원본 조회'],['Redis','TTL과 저장']],
        'REDIS-17': [['SET NX PX','Token + 임대'],['임계 작업','TTL 안에'],['Fencing','오래된 쓰기 차단'],['Lua 해제','Token 확인']],
        'KAFKA-02': [['Producer','Record'],['Topic','논리 이름'],['Partition','순서 있는 Log'],['Broker','복제 저장']],
        'KAFKA-07': [['At-most-once','유실 가능'],['At-least-once','중복 가능'],['멱등 처리','Event ID'],['결과','업무상 한 번']],
        'KAFKA-11': [['Event 수신','Offset N'],['DB 반영','멱등 쓰기'],['Offset Commit','N + 1'],['장애 재시도','중복 제거']],
        'KAFKA-22': [['업무 변경','DB Transaction'],['Outbox','같이 Commit'],['Publisher','Kafka 전송'],['Consumer','멱등 반영']],
        'JD-01': [['Control Plane','설정 배포'],['SDK 동기화','Version 확인'],['불변 Snapshot','원자 교체'],['로컬 평가','네트워크 없음']],
        'JD-06': [['고객 요청','Event 생성'],['Bounded Queue','메모리 한도'],['Batcher','N건 또는 T초'],['Dispatcher','비동기 전송']],
        'JD-10': [['Ingestion API','인증 · Quota'],['Kafka','내구성 Buffer'],['Processor','검증 · 중복 제거'],['Storage','원본 · 집계']],
        'JD-15': [['Seed + User ID','같은 입력'],['Hash','균등 숫자'],['10,000 Slots','고정 공간'],['Variation','결정적 그룹']],
        'JD-26': [['Readiness OFF','새 요청 차단'],['Drain','진행 요청 완료'],['Flush','Event · Offset'],['SIGTERM 종료','자원 닫기']]
      };
      const nodes = flows[id] || [];
      if (!nodes.length) return null;
      return '<div class="flow">' + nodes.map((node, index) => (index ? '<div class="flow-arrow"><i class="packet"></i></div>' : '') + '<div class="flow-node">' + node[0] + '<small>' + node[1] + '</small></div>').join('') + '</div>';
    }

    function cardFor(item) {
      const sentences = splitSentences(item.answer);
      const first = sentences.shift() || item.answer;
      const steps = sentences.length ? '<ol class="steps">' + sentences.map((sentence) => '<li>' + escapeHtml(sentence) + '</li>').join('') + '</ol>' : '';
      const terms = glossaryFor(item);
      const termsMarkup = terms.length ? '<span class="answer-label" style="margin-top:18px">영어·용어 먼저 풀기</span><div class="term-list">' + terms.map(([term, meaning]) => '<div class="term"><b>' + escapeHtml(term) + '</b>' + escapeHtml(meaning) + '</div>').join('') + '</div>' : '';
      const easy = item.easy ? '<div class="easy-note"><b>비유로 이해하기</b><br>' + escapeHtml(item.easy) + '</div>' : '';
      const caution = item.caution ? '<div class="caution-note"><b>헷갈리지 않기</b><br>' + escapeHtml(item.caution) + '</div>' : '';
      const diagramContent = diagramFor(item.id);
      const diagram = diagramContent ? '<button class="diagram-button" data-diagram="' + item.id + '">▶ 그림으로 보기</button>' : '';
      return '<details class="question-card" data-id="' + item.id + '"><summary><span class="qid">' + item.id + '</span><span class="question">' + escapeHtml(item.question) + '</span><span class="stars">' + '★'.repeat(item.priority) + '</span></summary><div class="answer-panel"><div class="answer-block"><span class="answer-label">30초 핵심</span><p class="one-line">' + escapeHtml(first) + '</p><span class="answer-label">차근차근 원리</span>' + steps + termsMarkup + easy + caution + '<div class="card-actions">' + statusButtons(item) + diagram + '</div>' + (diagramContent ? '<div class="diagram" id="diagram-' + item.id + '">' + diagramContent + '</div>' : '') + '</div></div></details>';
    }

    function renderQuestions() {
      const items = filteredData();
      resultCount.textContent = items.length + '개 질문';
      if (!items.length) {
        questionsRoot.innerHTML = '<div class="empty">조건에 맞는 질문이 없습니다.<br>검색어나 필터를 바꿔 보세요.</div>';
        return;
      }
      const groups = new Map();
      items.forEach((item) => {
        const key = item.domain + ' · ' + item.topic;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      });
      questionsRoot.innerHTML = [...groups.entries()].map(([name, group]) => '<h2 class="topic-heading">' + escapeHtml(name) + '<span>' + group.length + '문항</span></h2>' + group.map(cardFor).join('')).join('');
    }

    function renderPractice() {
      const items = filteredData();
      if (!items.length) {
        practiceStage.innerHTML = '<div class="empty">연습할 질문이 없습니다. 필터를 바꿔 보세요.</div>';
        return;
      }
      state.practiceIndex = Math.min(state.practiceIndex, items.length - 1);
      const item = items[state.practiceIndex];
      const status = state.progress[item.id] || '';
      practiceStage.innerHTML = '<article class="flashcard"><div class="flashcard-top"><span>' + item.id + ' · ' + escapeHtml(item.topic) + '</span><span>' + (state.practiceIndex + 1) + ' / ' + items.length + ' · ' + '★'.repeat(item.priority) + '</span></div><h2 class="flash-question">' + escapeHtml(item.question) + '</h2><button class="primary-action" id="reveal-answer">' + (state.practiceAnswerVisible ? '답변 다시 가리기' : '말해 본 뒤 답변 보기') + '</button><div class="answer-reveal ' + (state.practiceAnswerVisible ? 'visible' : '') + '"><span class="answer-label">모범 답안</span><p>' + escapeHtml(item.answer) + '</p>' + (item.easy ? '<div class="easy-note">' + escapeHtml(item.easy) + '</div>' : '') + '</div><div class="practice-actions"><button class="practice-action" id="previous-question">← 이전</button><div class="right"><button class="status-button review" data-status="review" data-id="' + item.id + '" data-active="' + (status === 'review') + '">↺ 복습</button><button class="status-button" data-status="done" data-id="' + item.id + '" data-active="' + (status === 'done') + '">✓ 이해</button><button class="practice-action" id="next-question">다음 →</button></div></div></article>';
    }

    function updateProgress() {
      const done = Object.values(state.progress).filter((value) => value === 'done').length;
      document.getElementById('progress-text').textContent = done + ' / ' + DATA.length;
      document.getElementById('progress-fill').style.width = (done / DATA.length * 100) + '%';
      localStorage.setItem('cs-interview-progress', JSON.stringify(state.progress));
    }

    function rerender() {
      renderDomains();
      renderQuestions();
      renderPractice();
      updateProgress();
    }

    domainList.addEventListener('click', (event) => {
      const button = event.target.closest('[data-domain]');
      if (!button) return;
      state.domain = button.dataset.domain;
      state.practiceIndex = 0;
      state.practiceAnswerVisible = false;
      rerender();
    });

    document.getElementById('search').addEventListener('input', (event) => {
      state.query = event.target.value;
      state.practiceIndex = 0;
      renderQuestions();
      renderPractice();
    });

    document.querySelector('.priority-filter').addEventListener('click', (event) => {
      const button = event.target.closest('[data-priority]');
      if (!button) return;
      state.priority = Number(button.dataset.priority);
      state.practiceIndex = 0;
      state.practiceAnswerVisible = false;
      document.querySelectorAll('[data-priority]').forEach((item) => item.classList.toggle('active', item === button));
      renderQuestions();
      renderPractice();
    });

    document.querySelector('.view-tabs').addEventListener('click', (event) => {
      const button = event.target.closest('[data-view]');
      if (!button) return;
      state.view = button.dataset.view;
      document.querySelectorAll('[data-view]').forEach((item) => item.classList.toggle('active', item === button));
      listView.classList.toggle('active', state.view === 'list');
      practiceView.classList.toggle('active', state.view === 'practice');
      document.getElementById('sidebar').classList.remove('open');
    });

    questionsRoot.addEventListener('click', (event) => {
      const diagramButton = event.target.closest('[data-diagram]');
      if (diagramButton) {
        const panel = document.getElementById('diagram-' + diagramButton.dataset.diagram);
        panel.classList.toggle('visible');
        diagramButton.textContent = panel.classList.contains('visible') ? '▼ 그림 접기' : '▶ 그림으로 보기';
        return;
      }
      handleStatus(event);
    });

    practiceStage.addEventListener('click', (event) => {
      if (event.target.closest('#reveal-answer')) {
        state.practiceAnswerVisible = !state.practiceAnswerVisible;
        renderPractice();
      } else if (event.target.closest('#previous-question')) {
        const length = filteredData().length;
        state.practiceIndex = (state.practiceIndex - 1 + length) % length;
        state.practiceAnswerVisible = false;
        renderPractice();
      } else if (event.target.closest('#next-question')) {
        const length = filteredData().length;
        state.practiceIndex = (state.practiceIndex + 1) % length;
        state.practiceAnswerVisible = false;
        renderPractice();
      } else {
        handleStatus(event);
      }
    });

    function handleStatus(event) {
      const button = event.target.closest('[data-status][data-id]');
      if (!button) return;
      const { id, status } = button.dataset;
      state.progress[id] = state.progress[id] === status ? '' : status;
      updateProgress();
      if (state.view === 'practice') renderPractice(); else renderQuestions();
    }

    document.getElementById('expand-all').addEventListener('click', (event) => {
      const cards = [...document.querySelectorAll('.question-card')];
      const shouldOpen = cards.some((card) => !card.open);
      cards.forEach((card) => { card.open = shouldOpen; });
      event.target.textContent = shouldOpen ? '현재 결과 모두 접기' : '현재 결과 모두 펼치기';
    });

    document.getElementById('menu-button').addEventListener('click', (event) => {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('open');
      event.currentTarget.setAttribute('aria-expanded', String(sidebar.classList.contains('open')));
    });

    rerender();
  </script>
</body>
</html>
