services:
  redis:
    image: redis:7.4.2-alpine
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mysql:
    image: mysql:8.4
    cpus: 1.0
    mem_limit: 1g
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-commerce_lab}
      MYSQL_USER: ${MYSQL_USER:-commerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-commerce}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    cpus: 1.0
    mem_limit: 768m
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-commerce_lab}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-commerce}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-commerce}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      WAITING_ROOM_PROMOTION_READINESS_TTL: ${WAITING_ROOM_PROMOTION_READINESS_TTL:-100ms}
      WAITING_ROOM_POLL_INTERVAL: ${WAITING_ROOM_POLL_INTERVAL:-1s}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
