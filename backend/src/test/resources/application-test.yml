spring:
  datasource:
    url: jdbc:h2:mem:commerce_lab;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: http://localhost:3000
  labs:
    cache:
      ttl: 500ms
      origin-delay: 0ms
      lock-lease: 2s
      lock-wait-timeout: 100ms
      lock-poll-interval: 10ms

management:
  health:
    redis:
      enabled: false
