spring:
  datasource:
    url: jdbc:h2:mem:commerce_lab;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  health:
    redis:
      enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000
  labs:
    waiting-room:
      max-concurrency: 2
      work-duration: 1ms
      ticket-ttl: 30s
      admission-ttl: 10s
      processing-lease-ttl: 5s
      promotion-readiness-ttl: 100ms
      poll-interval: 1s
