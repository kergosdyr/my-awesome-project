spring:
  application:
    name: commerce-lab-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/commerce_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_TIMEOUT:500ms}
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_updates: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  labs:
    cache:
      ttl: ${CACHE_LAB_TTL:500ms}
      origin-delay: ${CACHE_LAB_ORIGIN_DELAY:40ms}
      lock-lease: ${CACHE_LAB_LOCK_LEASE:2s}
      lock-wait-timeout: ${CACHE_LAB_LOCK_WAIT_TIMEOUT:1s}
      lock-poll-interval: ${CACHE_LAB_LOCK_POLL_INTERVAL:10ms}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
