spring:
  application:
    name: commerce-lab-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/commerce_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  labs:
    waiting-room:
      max-concurrency: ${WAITING_ROOM_MAX_CONCURRENCY:4}
      work-duration: ${WAITING_ROOM_WORK_DURATION:50ms}
      ticket-ttl: ${WAITING_ROOM_TICKET_TTL:30s}
      admission-ttl: ${WAITING_ROOM_ADMISSION_TTL:10s}
      processing-lease-ttl: ${WAITING_ROOM_PROCESSING_LEASE_TTL:5s}
      promotion-readiness-ttl: ${WAITING_ROOM_PROMOTION_READINESS_TTL:100ms}
      poll-interval: ${WAITING_ROOM_POLL_INTERVAL:1s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
