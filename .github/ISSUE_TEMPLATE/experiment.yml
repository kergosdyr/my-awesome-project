name: 실험 제안
description: 재현 가능한 커머스 실험을 정의합니다.
title: "[Lab] "
labels: [experiment]
body:
  - type: textarea
    id: question
    attributes:
      label: 질문
      description: 이번 실험으로 답하려는 질문을 한 문장으로 적어주세요.
      placeholder: 동일한 상품에 요청이 몰릴 때 어떤 캐시 전략이 DB 부하를 가장 안정적으로 줄이는가?
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: 가설
      description: 비교할 기준선과 예상 결과를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 재현 시나리오
      description: 데이터 규모, 동시성, 지속 시간, 실패 조건을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: 관측 지표
      placeholder: p50/p95/p99, 처리량, DB QPS, 오류율, 중복 처리 건수
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 어떤 증거가 모이면 실험을 끝낼지 적어주세요.
    validations:
      required: true
